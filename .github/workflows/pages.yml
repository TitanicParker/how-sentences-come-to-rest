name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Book II part pages
        shell: bash
        run: |
          set -euo pipefail
          for file in books/02-atlas-of-remainders/parts/*.md; do
            base="$(basename "$file" .md)"
            dir="books/02-atlas-of-remainders/parts/$base"
            title="$(head -n 1 "$file" | sed 's/^# *//')"
            mkdir -p "$dir"
            {
              echo "---"
              echo "title: $title"
              echo "book: II"
              echo "book_class: book-two"
              echo "---"
              echo ""
              cat "$file"
              echo ""
              echo "---"
              echo ""
              echo "[Return to Book II](../../) · [Return to Book I](../../../../)"
            } > "$dir/index.md"
          done

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
